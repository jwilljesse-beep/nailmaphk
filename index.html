        <button id="btnLocateMobile" class="bg-white p-2 rounded-lg shadow-md text-text-subtle hover:text-text-main transition-colors">
          <span class="material-symbols-outlined">my_location</span>
        </button>
      </div>

<script>
/* ===============================
   ✅ API URL (你的 Apps Script /exec)
=============================== */
const API_URL = "https://script.google.com/macros/s/AKfycbwOFC2Dj31_WGgI2C0S7RGr74ueVQ3Z3rkEIzoFtW12El_VMgW-afwGAToEZrKLEnyh2A/exec";

/* ===============================
   ✅ State & Favorites
=============================== */
let SALONS = [];
let state = {
  q: "",
  activeTags: new Set(),
  userLoc: null,
  nearMeMode: false,
};
const FAV_KEY = "nailmap_favs_v1";
function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); } catch(e) { return new Set(); }
}
function saveFavs(set) {
  localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
}
let favs = loadFavs();

/* ===============================
   ✅ Helpers
=============================== */
function escapeHtml(str="") {
  return String(str).replace(/[&<>"']/g, (m) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[m]));
}

function norm(s="") {
  return String(s)
    .toLowerCase()
    .replace(/[\s\-_/]+/g, "")
    .replace(/[()（）]/g, "")
    .trim();
}

function toRad(d) { return d * Math.PI / 180; }
function haversineKm(aLat, aLng, bLat, bLng) {
  const R = 6371;
  const dLat = toRad(bLat - aLat);
  const dLng = toRad(bLng - aLng);
  const s1 = Math.sin(dLat/2) ** 2;
  const s2 = Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * (Math.sin(dLng/2) ** 2);
  return 2 * R * Math.asin(Math.sqrt(s1 + s2));
}

function priceTierToNum(t) { return (t || "").trim().length; } // $=1, $$=2...
function formatPriceDisplay(s) {
  const minTier = (s.price_tier_min || "").trim();
  const maxTier = (s.price_tier_max || "").trim();
  const range = (s.price_range_hkd || "").trim(); // e.g. 218–358

  let tierText = "";
  if (minTier && maxTier) {
    tierText = (priceTierToNum(minTier) <= priceTierToNum(maxTier))
      ? `${minTier}-${maxTier}`
      : `${maxTier}-${minTier}`;
  } else if (minTier || maxTier) {
    tierText = (minTier || maxTier);
  }

  if (!tierText) return "";

  if (range) {
    // Normalize dash
    const r = range.replace(/–/g, "－").replace(/-/g, "－");
    return `${tierText}（HKD${r}）`;
  }
  return tierText;
}

function getSearchBlob(s) {
  // 中英文都搜：district + district_en + aliases + tags + address_display + note + name
  return norm([
    s.name, s.district, s.district_en, s.area_group,
    s.location_type, s.address_display, s.note,
    (s.tags || []).join(" "),
    (s.aliases || []).join(" "),
  ].join(" "));
}

function matchesQuery(s, q) {
  if (!q) return true;
  return getSearchBlob(s).includes(norm(q));
}

function matchesTags(s, tagsSet) {
  if (tagsSet.size === 0) return true;
  const t = new Set(s.tags || []);
  for (const tag of tagsSet) if (!t.has(tag)) return false;
  return true;
}

/* ===============================
   ✅ Map (desktop + mobile)
=============================== */
let map = null, markerLayer = null, userMarker = null;

function initMap(elId) {
  const m = L.map(elId, { zoomControl: false }).setView([22.3200, 114.1700], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(m);

  const layer = L.layerGroup().addTo(m);
  return { m, layer };
}

function setUserMarkerOn(layer, lat, lng) {
  if (userMarker) layer.removeLayer(userMarker);
  userMarker = L.circleMarker([lat, lng], { radius: 8, weight: 2, fillOpacity: 0.25 }).addTo(layer);
  userMarker.bindPopup("<b>你而家位置</b><br/>（只作附近搜尋用途）");
}

/* ===============================
   ✅ Render
=============================== */
function privacyHintByLocationNorm(s) {
  const normType = (s.location_type_norm || "").trim();
  if (normType === "Building") return "商廈/工作室：只顯示大概位置；到訪地址以店方確認為準";
  if (normType === "Mall") return "商場/攤位：以公開地址顯示為主；到訪前請再核實";
  return "到訪地址以店方確認為準";
}

function getFiltered() {
  let items = SALONS
    .filter(s => String(s.status || "").toLowerCase() === "active")
    .filter(s => matchesQuery(s, state.q))
    .filter(s => matchesTags(s, state.activeTags));

  if (state.nearMeMode && state.userLoc) {
    items = items.map(s => {
      if (typeof s.lat === "number" && typeof s.lng === "number") {
        return { ...s, _km: haversineKm(state.userLoc.lat, state.userLoc.lng, s.lat, s.lng) };
      }
      return { ...s, _km: null };
    }).sort((a,b) => {
      if (a._km == null && b._km == null) return 0;
      if (a._km == null) return 1;
      if (b._km == null) return -1;
      return a._km - b._km;
    });
  }
  return items;
}

function renderList(items) {
  const list = document.getElementById("list");
  const countText = document.getElementById("countText");
  countText.textContent = items.length;

  list.innerHTML = items.map(s => {
    const priceText = formatPriceDisplay(s);
    const distance = (state.nearMeMode && state.userLoc && s._km != null)
      ? `<span class="text-xs font-semibold text-text-subtle">${s._km.toFixed(2)} km</span>`
      : "";

    const tags = (s.tags || []).slice(0, 6).map(t => `
      <span class="px-2 py-1 bg-background-light rounded text-xs font-medium text-text-subtle">${escapeHtml(t)}</span>
    `).join("");

    const showUpdated = String(s.show_updated || "").toLowerCase() === "yes" && s.last_verified
      ? `<div class="text-[11px] text-text-subtle mt-1">Updated: ${escapeHtml(s.last_verified)}</div>`
      : "";

    const heartActive = favs.has(s.id);
    const heartIcon = heartActive ? "favorite" : "favorite_border";
    const heartCls = heartActive ? "text-tertiary" : "text-text-subtle";

    const source = s.source_url
      ? `<a class="text-xs text-primary-hover hover:underline" href="${escapeHtml(s.source_url)}" target="_blank" rel="noopener">Source</a>`
      : `<span class="text-xs text-text-subtle">Source: —</span>`;

    return `
      <article data-id="${escapeHtml(s.id)}"
        class="salonCard group relative bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-all border border-transparent hover:border-primary/20 cursor-pointer">
        <div class="flex flex-col gap-3">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h3 class="text-lg font-extrabold text-text-main leading-tight group-hover:text-primary-hover transition-colors truncate">
                ${escapeHtml(s.name)}
              </h3>
              <p class="text-text-subtle text-sm mt-1">
                ${escapeHtml(s.district || "")}
                ${s.district_en ? ` • ${escapeHtml(s.district_en)}` : ""}
                ${priceText ? ` • ${escapeHtml(priceText)}` : ""}
              </p>
              ${showUpdated}
            </div>
            <div class="flex flex-col items-end gap-1">
              ${distance}
              <button data-fav="${escapeHtml(s.id)}" class="favBtn p-1.5 bg-white border border-border-subtle rounded-full hover:bg-background-light">
                <span class="material-symbols-outlined ${heartCls}" style="font-size:20px;">${heartIcon}</span>
              </button>
            </div>
          </div>

          <div class="flex flex-wrap gap-2">${tags}</div>

          <div class="pt-3 border-t border-background-light">
            <div class="text-sm text-text-main">
              <span class="material-symbols-outlined align-[-5px] text-[18px] text-text-subtle">location_on</span>
              ${escapeHtml(s.address_display || "")}
            </div>
            <div class="text-xs text-text-subtle mt-1">${escapeHtml(s.note || "")}</div>

            <div class="mt-2 flex items-start justify-between gap-3">
              <p class="text-[11px] text-text-subtle flex items-start gap-1.5 leading-snug">
                <span class="material-symbols-outlined text-[14px] shrink-0 translate-y-[1px]">info</span>
                ${escapeHtml(privacyHintByLocationNorm(s))}
              </p>
              ${source}
            </div>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function renderMarkers(items) {
  if (!map || !markerLayer) return;
  markerLayer.clearLayers();
  if (state.userLoc) setUserMarkerOn(markerLayer, state.userLoc.lat, state.userLoc.lng);

  const pts = [];

  items.forEach(s => {
    if (typeof s.lat !== "number" || typeof s.lng !== "number") return; // ✅ no coords -> no marker
    pts.push([s.lat, s.lng]);

    const m = L.marker([s.lat, s.lng]).addTo(markerLayer);
    m._salonId = s.id;

    const priceText = formatPriceDisplay(s);
    const tags = (s.tags || []).slice(0, 6).map(t =>
      `<span style="display:inline-block;margin:2px 6px 0 0;padding:2px 8px;border:1px solid #EBDAD4;border-radius:999px;font-size:11px;">${escapeHtml(t)}</span>`
    ).join("");

    const src = s.source_url
      ? `<div style="margin-top:8px;"><a href="${escapeHtml(s.source_url)}" target="_blank" rel="noopener" style="color:#E57A85;text-decoration:underline;">Source</a></div>`
      : "";

    m.bindPopup(`
      <div style="min-width:240px;">
        <div style="font-weight:800;font-size:15px;color:#543D37;">${escapeHtml(s.name)}</div>
        <div style="margin-top:4px;font-size:12px;color:#99827D;">
          ${escapeHtml(s.district || "")}${s.district_en ? " • " + escapeHtml(s.district_en) : ""}${priceText ? " • " + escapeHtml(priceText) : ""}
        </div>
        <div style="margin-top:8px;font-size:13px;color:#543D37;">
          <b>位置（大概）</b>：${escapeHtml(s.address_display || "")}
        </div>
        <div style="margin-top:8px;">${tags}</div>
        <div style="margin-top:10px;font-size:11px;color:#99827D;">
          ${escapeHtml(privacyHintByLocationNorm(s))}
        </div>
        ${src}
      </div>
    `);
  });

  if (pts.length) {
    const bounds = L.latLngBounds(pts);
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  }
}

function syncAll() {
  const items = getFiltered();
  renderList(items);
  renderMarkers(items);
}

/* ===============================
   ✅ Events
=============================== */
function setQuery(q) {
  state.q = q || "";
  syncAll();
}

document.getElementById("qTop")?.addEventListener("input", e => setQuery(e.target.value));
document.getElementById("qMobile")?.addEventListener("input", e => setQuery(e.target.value));

document.querySelectorAll(".tagChip").forEach(btn => {
  btn.addEventListener("click", () => {
    const tag = btn.getAttribute("data-tag");
    const active = state.activeTags.has(tag);
    if (active) state.activeTags.delete(tag);
    else state.activeTags.add(tag);

    btn.classList.toggle("border-primary", !active);
    btn.classList.toggle("text-primary", !active);
    btn.classList.toggle("bg-primary/10", !active);

    syncAll();
  });
});

document.getElementById("btnReset")?.addEventListener("click", () => {
  state.q = "";
  state.activeTags.clear();
  state.nearMeMode = false;

  const qTop = document.getElementById("qTop");
  const qMobile = document.getElementById("qMobile");
  if (qTop) qTop.value = "";
  if (qMobile) qMobile.value = "";

  document.querySelectorAll(".tagChip").forEach(btn => {
    btn.classList.remove("border-primary", "text-primary", "bg-primary/10");
  });

  syncAll();
});

function requestGeolocation() {
  console.log("[NearMe] clicked");

  if (!window.isSecureContext) {
    alert("Near Me 需要 HTTPS 才可用。");
    return;
  }
  if (!navigator.geolocation) {
    alert("你的瀏覽器不支援定位功能。");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.nearMeMode = true;
      console.log("[NearMe] got location", state.userLoc);

      if (map && markerLayer) {
        setUserMarkerOn(markerLayer, state.userLoc.lat, state.userLoc.lng);
        map.setView([state.userLoc.lat, state.userLoc.lng], 15);
        // ✅ hidden -> show map needs invalidate
        setTimeout(() => { try { map.invalidateSize(true); } catch(e) {} }, 350);
      }
      syncAll();
    },
    (err) => {
      console.warn("[NearMe] error", err);
      if (err.code === 1) alert("定位被拒絕。請到 iPhone 設定 → Safari → 位置 → 允許，或網站設定中允許定位。");
      else if (err.code === 2) alert("未能取得位置（訊號不足或定位服務關閉）。");
      else alert("未能取得你的位置。");
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}

document.getElementById("btnNearMe")?.addEventListener("click", requestGeolocation);
document.getElementById("btnLocate")?.addEventListener("click", requestGeolocation);
document.getElementById("btnZoomIn")?.addEventListener("click", () => map && map.zoomIn());
document.getElementById("btnZoomOut")?.addEventListener("click", () => map && map.zoomOut());

document.getElementById("btnLocateMobile")?.addEventListener("click", requestGeolocation);

document.getElementById("list")?.addEventListener("click", (e) => {
  const favBtn = e.target.closest(".favBtn");
  if (favBtn) {
    e.preventDefault();
    e.stopPropagation();
    const id = favBtn.getAttribute("data-fav");
    if (!id) return;

    if (favs.has(id)) favs.delete(id);
    else favs.add(id);

    saveFavs(favs);
    syncAll();
    return;
  }

  const card = e.target.closest(".salonCard");
  if (!card) return;
  const id = card.getAttribute("data-id");
  const items = getFiltered();
  const s = items.find(x => x.id === id);
  if (!s) return;
  if (typeof s.lat === "number" && typeof s.lng === "number" && map) {
    map.setView([s.lat, s.lng], 16);
    markerLayer && markerLayer.eachLayer(layer => {
      if (layer._salonId === id) layer.openPopup();
    });
  } else {
    alert("呢間店暫未有座標（可先顯示 list，之後再補地圖資料）。");
  }
});

/* ===============================
   ✅ Mobile tab toggle
=============================== */
function setMobileTab(which) {
  const tabList = document.getElementById("tabList");
  const tabMap = document.getElementById("tabMap");
  const listWrap = document.getElementById("listWrap");
  const mapWrapMobile = document.getElementById("mapWrapMobile");

  if (which === "map") {
    tabMap.classList.add("bg-text-main","text-white");
    tabMap.classList.remove("text-text-main");
    tabList.classList.remove("bg-text-main","text-white");
    tabList.classList.add("text-text-main");

    listWrap.classList.add("hidden");
    mapWrapMobile.classList.remove("hidden");

    // lazy init map on mobile container
    if (!map) {
      const { m, layer } = initMap("mapMobile");
      map = m; markerLayer = layer;
      setTimeout(() => { try { map.invalidateSize(true); } catch(e) {} }, 350);
      syncAll();
    } else {
      setTimeout(() => { try { map.invalidateSize(true); } catch(e) {} }, 350);
    }
  } else {
    tabList.classList.add("bg-text-main","text-white");
    tabList.classList.remove("text-text-main");
    tabMap.classList.remove("bg-text-main","text-white");
    tabMap.classList.add("text-text-main");

    mapWrapMobile.classList.add("hidden");
    listWrap.classList.remove("hidden");
  }
}

document.getElementById("tabList")?.addEventListener("click", () => setMobileTab("list"));
document.getElementById("tabMap")?.addEventListener("click", () => setMobileTab("map"));

/* ===============================
   ✅ Load data from Sheets API
=============================== */
async function loadSalonsFromSheet() {
  const statusEl = document.getElementById("apiStatus");
  try {
    statusEl.textContent = "Loading data…";
    const res = await fetch(API_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();

    // API 可能係 array（正常）或 debug object（?debug=1）
    const arr = Array.isArray(data) ? data : (Array.isArray(data.data) ? data.data : []);

    SALONS = arr.map(s => ({
      ...s,
      // tags/aliases ensure array
      tags: Array.isArray(s.tags) ? s.tags : [],
      aliases: Array.isArray(s.aliases) ? s.aliases : [],
      lat: (s.lat === null || s.lat === "" || typeof s.lat === "undefined") ? null : Number(s.lat),
      lng: (s.lng === null || s.lng === "" || typeof s.lng === "undefined") ? null : Number(s.lng),
    }));

    statusEl.textContent = `Loaded ${SALONS.length} active salons.`;
    syncAll();
  } catch (err) {
    console.error(err);
    if (statusEl) statusEl.textContent = "讀取資料失敗：請檢查 API_URL / 部署權限 / 網絡。";
    alert("讀取資料失敗：請檢查 Apps Script Web App 部署權限 或 API_URL。");
  }
}

/* ===============================
   ✅ Desktop map init (only on lg+)
=============================== */
function initDesktopMapIfNeeded() {
  const isLg = window.matchMedia("(min-width: 1024px)").matches;
  if (!isLg) return;
  if (map) return;

  const { m, layer } = initMap("map");
  map = m; markerLayer = layer;
  syncAll();
}

// on load
initDesktopMapIfNeeded();
loadSalonsFromSheet();
window.addEventListener("resize", initDesktopMapIfNeeded);

// auto refresh (optional)
setInterval(() => loadSalonsFromSheet().catch(console.error), 5 * 60 * 1000);
</script>
