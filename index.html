<script>
/* =========================
   CONFIG
========================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzIweqyWYjcpMLsFB69d_a-l7RqeDhwpDJDpT_JVSJEUJUKBkRfR-wil4ttqkKlxRkvDg/exec";

/* =========================
   Helpers
========================= */
function norm(str) {
  return String(str || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\u4e00-\u9fff]+/g, " ").replace(/\s+/g, " ").trim();
}

function splitList(v) {
  if (Array.isArray(v)) return v.map(x => String(x).trim()).filter(Boolean);
  const s = String(v || "").trim();
  if (!s) return [];
  return s.split(",").map(x => x.trim()).filter(Boolean);
}

function toBool(v) {
  const s = String(v || "").toLowerCase().trim();
  return s === "yes" || s === "true" || s === "1";
}

function toNum(v) {
  if (v === "" || v == null) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function haversineKm(aLat, aLng, bLat, bLng) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(bLat - aLat);
  const dLng = toRad(bLng - aLng);
  const s1 = Math.sin(dLat/2) ** 2;
  const s2 = Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * (Math.sin(dLng/2) ** 2);
  return 2 * R * Math.asin(Math.sqrt(s1 + s2));
}

function escapeHtml(str="") {
  return String(str).replace(/[&<>"']/g, (m) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[m]));
}

function debounce(func, wait) {
  let timeout;
  return function(...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}

/* =========================
   ✅ Price Calculation Logic
========================= */
// 規則：$ (<200), $$ (200-499), $$$ (500-799), $$$$ (800-1299), $$$$$ (1300+)
function getTierSymbol(val) {
  if (val < 200) return "$";
  if (val < 500) return "$$";
  if (val < 800) return "$$$";
  if (val < 1300) return "$$$$";
  return "$$$$$";
}

function formatPriceDisplay(s) {
  // 1. 嘗試從欄位中提取所有數字 (處理 "218-1227" 或 "From 200" 等情況)
  // 優先看 price_range_hkd，如果沒有則看 price_tier_min
  let rawStr = (s.price_range_hkd || "") + " " + (s.price_tier_min || "");
  let numbers = rawStr.match(/\d+/g);

  // ✅ 情況 A: 找得到數字 -> 自動計算 Tier
  if (numbers && numbers.length > 0) {
    // 轉成數字並排序
    let nums = numbers.map(n => parseInt(n, 10)).sort((a, b) => a - b);
    let minPrice = nums[0];
    let maxPrice = nums[nums.length - 1];

    let minTier = getTierSymbol(minPrice);
    let maxTier = getTierSymbol(maxPrice);

    // 格式化 Tier: "$$-$$$$" 或 "$$"
    let tierStr = (minTier === maxTier) ? minTier : `${minTier}-${maxTier}`;
    
    // 格式化 Range: "HKD 218–1227" 或 "HKD 218"
    let rangeStr = (minPrice === maxPrice) ? `HKD${minPrice}` : `HKD${minPrice}－${maxPrice}`;

    return `${tierStr}（${rangeStr}）`;
  }

  // ✅ 情況 B: 找不到數字 -> 退回使用原本的文字顯示 (Legacy Support)
  // 這處理如果 Sheet 只有寫 "$" 但沒寫數字的情況
  const minTier = (s.price_tier_min || "").trim();
  const maxTier = (s.price_tier_max || "").trim();
  let tierText = "";
  if (minTier && maxTier) {
    if (minTier === maxTier) tierText = minTier;
    else tierText = (minTier.length < maxTier.length) ? `${minTier}-${maxTier}` : `${maxTier}-${minTier}`;
  } else {
    tierText = (minTier || maxTier);
  }
  
  if (tierText) return tierText; // 只有符號，沒有價格
  return "";
}

/* =========================
   Search Synonyms
========================= */
const DISTRICT_SYNONYMS = [
  { en: ["laichikok", "lai chi kok", "laichilok", "lai chi lok", "lck"], zh: ["荔枝角"] },
  { en: ["cheungshawan", "cheung sha wan", "changshawan", "csw"], zh: ["長沙灣"] },
  { en: ["shamshuipo", "sham shui po", "ssp"], zh: ["深水埗"] },
  { en: ["mongkok", "mong kok", "mk"], zh: ["旺角"] },
  { en: ["tsimshatsui", "tsim sha tsui", "tst"], zh: ["尖沙咀"] },
  { en: ["causewaybay", "causeway bay", "cwb"], zh: ["銅鑼灣"] },
  { en: ["wanchai", "wan chai"], zh: ["灣仔"] },
  { en: ["central"], zh: ["中環"] },
  { en: ["sheungwan", "sheung wan"], zh: ["上環"] },
];

function expandQueryVariants(q) {
  const raw = String(q || "");
  const n = norm(raw);
  if (!n) return [];
  const vars = new Set([n]);
  for (const item of DISTRICT_SYNONYMS) {
    const allKeywords = [...item.en, ...item.zh];
    const isHit = allKeywords.some(k => n.includes(norm(k)));
    if (isHit) {
      allKeywords.forEach(k => vars.add(norm(k)));
    }
  }
  return [...vars];
}

/* =========================
   Data & State
========================= */
let SALONS = [];
let state = { q: "", activeTags: new Set(), nearMeMode: false, userLoc: null, requireCoords: false };
let pageSize = 60;
let page = 1;

const FAV_KEY = "nailmap_favs_v1";
function getFavSet() { try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); } catch { return new Set(); } }
function saveFavSet(set) { localStorage.setItem(FAV_KEY, JSON.stringify([...set])); }

/* =========================
   Map Init
========================= */
const defaultCenter = [22.3369, 114.1476];
const defaultZoom = 12;
const mapDesktop = L.map("mapDesktop", { zoomControl: false }).setView(defaultCenter, defaultZoom);
const mapMobile  = L.map("mapMobile",  { zoomControl: false }).setView(defaultCenter, defaultZoom);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(mapDesktop);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(mapMobile);

const layerDesktop = L.layerGroup().addTo(mapDesktop);
const layerMobile  = L.layerGroup().addTo(mapMobile);

let userMarkerDesktop = null;
let userMarkerMobile  = null;
function setUserMarker(lat, lng) {
  if (userMarkerDesktop) layerDesktop.removeLayer(userMarkerDesktop);
  if (userMarkerMobile)  layerMobile.removeLayer(userMarkerMobile);
  const opt = { radius: 8, weight: 2, fillOpacity: 0.25 };
  userMarkerDesktop = L.circleMarker([lat,lng], opt).addTo(layerDesktop).bindPopup("你而家位置");
  userMarkerMobile  = L.circleMarker([lat,lng], opt).addTo(layerMobile).bindPopup("你而家位置");
}

/* =========================
   Smart Robust Normalization
========================= */
function normalizeSalon(raw) {
  const lookup = {};
  Object.keys(raw).forEach(k => {
    const cleanKey = k.toString().toLowerCase().replace(/[^a-z0-9]/g, "");
    lookup[cleanKey] = raw[k];
  });

  const getVal = (targetKeys) => {
    for (const t of targetKeys) {
      const cleanTarget = t.toLowerCase().replace(/[^a-z0-9]/g, "");
      const val = lookup[cleanTarget];
      if (val !== undefined && val !== null && String(val) !== "") {
        return val;
      }
    }
    return "";
  };

  const s = {}; 
  s.id = String(getVal(["id"]) || "").trim();
  s.name = String(getVal(["name", "shop_name"]) || "").trim();
  s.district = String(getVal(["district"]) || "").trim();
  s.district_en = String(getVal(["district_en"]) || "").trim();

  // Price keys
  s.price_tier_min = String(getVal(["price_tier_min", "min_price"]) || "").trim();
  s.price_tier_max = String(getVal(["price_tier_max", "max_price"]) || "").trim();
  s.price_range_hkd = String(getVal(["price_range_hkd", "price_range"]) || "").trim();

  s.lat = toNum(getVal(["lat", "latitude"]));
  s.lng = toNum(getVal(["lng", "longitude"]));
  
  s.tags = splitList(getVal(["tags"]));
  s.aliases = splitList(getVal(["aliases"]));
  s.address_display = String(getVal(["address_display", "address"]) || "").trim();
  s.note = String(getVal(["note"]) || "").trim();
  s.source_url = String(getVal(["source_url", "url"]) || "").trim();
  
  // ✅ Updated Data Info
  s.show_updated = toBool(getVal(["show_updated"]));
  // 處理日期格式：如果只有日期部分，保留；如果是 ISO，截取前段
  let verified = String(getVal(["last_verified"]) || "").trim();
  if (verified.includes("T")) verified = verified.split("T")[0];
  s.last_verified = verified;

  s.status = String(getVal(["status"]) || "").trim().toLowerCase();

  return s;
}

function getSearchBlob(s) {
  const fields = [s.id, s.name, s.district, s.district_en, s.location_type, s.address_display, s.note, s.source_url, ...(s.tags || []), ...(s.aliases || [])];
  return norm(fields.join(" "));
}

function matchesQuery(s, q) {
  if (!q) return true;
  const blob = getSearchBlob(s);
  const variants = expandQueryVariants(q);
  return variants.some(v => blob.includes(v));
}

// Filter logic including Price Tiers
function matchesTags(s, tagsSet) {
  if (tagsSet.size === 0) return true;
  
  // 為了 Filter 功能，我們也需要動態計算該店的 Tier
  // 這樣如果店鋪只寫了 "250"，Filter 點 "$$" 時也能找到它
  const itemTags = new Set((s.tags || []).map(t => t.toLowerCase()));
  
  // 自動計算 Tier 並加入 Tags Set 供篩選
  let rawStr = (s.price_range_hkd || "") + " " + (s.price_tier_min || "");
  let numbers = rawStr.match(/\d+/g);
  if (numbers && numbers.length > 0) {
     let nums = numbers.map(n => parseInt(n, 10));
     // 將該店包含的所有可能的 Tier 都加進去 (例如 200-900，涵蓋 $$, $$$, $$$$)
     let minP = Math.min(...nums);
     let maxP = Math.max(...nums);
     
     // 簡單檢查範圍包含
     if (minP < 200) itemTags.add("$");
     if (maxP >= 200 && minP < 500) itemTags.add("$$");
     if (maxP >= 500 && minP < 800) itemTags.add("$$$");
     if (maxP >= 800 && minP < 1300) itemTags.add("$$$$");
     if (maxP >= 1300) itemTags.add("$$$$$");
  } else {
     // 如果沒數字，用舊方法
     if (s.price_tier_min) itemTags.add(s.price_tier_min.toLowerCase());
     if (s.price_tier_max) itemTags.add(s.price_tier_max.toLowerCase());
  }

  for (const tag of tagsSet) { 
    if (!itemTags.has(tag.toLowerCase())) return false; 
  }
  return true;
}

function getFiltered() {
  let items = SALONS.filter(s => s.status === "active").filter(s => matchesQuery(s, state.q)).filter(s => matchesTags(s, state.activeTags));
  if (state.requireCoords) items = items.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));
  if (state.nearMeMode && state.userLoc) {
    items = items.map(s => {
      const has = Number.isFinite(s.lat) && Number.isFinite(s.lng);
      return { ...s, _km: has ? haversineKm(state.userLoc.lat, state.userLoc.lng, s.lat, s.lng) : null };
    }).sort((a,b) => {
      if (a._km == null) return 1; if (b._km == null) return -1;
      return a._km - b._km;
    });
  }
  return items;
}

/* =========================
   Render
========================= */
function renderList(items) {
  const favs = getFavSet();
  const list = document.getElementById("list");
  const shown = items.slice(0, page * pageSize);
  
  list.innerHTML = shown.map(s => {
    const price = formatPriceDisplay(s);
    const distance = (state.nearMeMode && state.userLoc && s._km != null) ? `<span class="text-xs font-semibold text-text-subtle">${s._km.toFixed(2)} km</span>` : "";
    const tags = (s.tags || []).slice(0, 5).map(t => `<span class="px-2 py-1 bg-background-light rounded text-xs font-medium text-text-subtle">${escapeHtml(t)}</span>`).join("");
    const hasCoords = Number.isFinite(s.lat) && Number.isFinite(s.lng);
    const pinHint = hasCoords ? "（地圖可顯示）" : "（暫無座標，只顯示列表）";
    const favOn = favs.has(s.id);
    const heartClass = favOn ? "text-tertiary" : "text-text-subtle";

    // ✅ Updated Date Logic
    const updatedHtml = (s.show_updated && s.last_verified) 
      ? `<span class="text-[10px] text-text-subtle/80 ml-auto bg-background-light px-1.5 py-0.5 rounded border border-border-subtle/50">Updated as ${escapeHtml(s.last_verified)}</span>` 
      : "";

    return `
      <article data-id="${escapeHtml(s.id)}" class="salonCard group bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-all border border-transparent hover:border-primary/20 cursor-pointer">
        <div class="flex flex-col gap-3">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="text-lg font-extrabold text-text-main leading-tight group-hover:text-primary-hover transition-colors">${escapeHtml(s.name)}</h3>
              <p class="text-text-subtle text-sm mt-1">
                ${escapeHtml(s.district || "—")}
                ${s.district_en ? ` • ${escapeHtml(s.district_en)}` : ""}
                ${price ? ` • <span class="font-semibold text-text-main">${escapeHtml(price)}</span>` : ""}
              </p>
              <p class="text-[11px] text-text-subtle mt-1">${escapeHtml(pinHint)}</p>
            </div>
            <div class="flex flex-col items-end gap-1">
              ${distance}
              <button data-fav="${escapeHtml(s.id)}" class="btnFav p-1.5 bg-white border border-border-subtle rounded-full hover:bg-background-light">
                <span class="material-symbols-outlined ${heartClass}" style="font-size:20px;">favorite</span>
              </button>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">${tags}</div>
          <div class="pt-3 border-t border-background-light">
             <div class="text-sm text-text-main"><span class="material-symbols-outlined align-[-5px] text-[18px] text-text-subtle">location_on</span> ${escapeHtml(s.address_display || "—")}</div>
             ${s.note ? `<div class="text-xs text-text-subtle mt-1">${escapeHtml(s.note)}</div>` : ""}
             
             <div class="mt-2 flex items-center justify-between">
                ${s.source_url ? `<a href="${s.source_url}" target="_blank" class="text-xs text-primary-hover underline">Source</a>` : "<span></span>"}
                ${updatedHtml}
             </div>
          </div>
        </div>
      </article>
    `;
  }).join("");

  document.getElementById("countText").textContent = items.length;
  document.getElementById("btnLoadMore").style.display = (shown.length < items.length) ? "inline-flex" : "none";
}

function renderMarkers(items) {
  layerDesktop.clearLayers();
  layerMobile.clearLayers();
  if (state.userLoc) setUserMarker(state.userLoc.lat, state.userLoc.lng);
  const withCoords = items.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));
  withCoords.forEach(s => {
    const price = formatPriceDisplay(s);
    const tags = (s.tags || []).slice(0, 4).map(t => `<span style="display:inline-block;margin:2px 2px 0 0;padding:2px 6px;border:1px solid #EBDAD4;border-radius:999px;font-size:10px;">${escapeHtml(t)}</span>`).join("");
    
    // ✅ Updated Date Logic for Map
    const updatedHtml = (s.show_updated && s.last_verified) 
      ? `<div style="margin-top:4px;font-size:9px;color:#999;text-align:right;">Updated as ${escapeHtml(s.last_verified)}</div>` 
      : "";

    const html = `
      <div style="min-width:220px;">
        <div style="font-weight:800;font-size:15px;color:#543D37;">${escapeHtml(s.name)}</div>
        <div style="margin-top:4px;font-size:12px;color:#99827D;">${escapeHtml(s.district)} ${price ? `• <b>${escapeHtml(price)}</b>` : ""}</div>
        <div style="margin-top:6px;font-size:13px;">${escapeHtml(s.address_display)}</div>
        <div style="margin-top:6px;">${tags}</div>
        ${updatedHtml}
        ${s.source_url ? `<div style="margin-top:6px;"><a href="${s.source_url}" target="_blank" style="color:#E57A85;">Source</a></div>` : ""}
      </div>
    `;
    const m1 = L.marker([s.lat, s.lng]).addTo(layerDesktop).bindPopup(html);
    const m2 = L.marker([s.lat, s.lng]).addTo(layerMobile).bindPopup(html);
    m1._salonId = s.id; m2._salonId = s.id;
  });
  if (withCoords.length > 0 && !state.nearMeMode) {
    const bounds = L.latLngBounds(withCoords.map(s => [s.lat, s.lng]));
    mapDesktop.fitBounds(bounds, { padding: [30,30], maxZoom: 16 });
    mapMobile.fitBounds(bounds, { padding: [30,30], maxZoom: 16 });
  }
}

function syncAll() {
  const items = getFiltered();
  renderList(items);
  renderMarkers(items);
}

/* =========================
   Events
========================= */
function setQuery(q) { state.q = q || ""; page = 1; syncAll(); }
const handleSearch = debounce((e) => setQuery(e.target.value), 300);
document.getElementById("qTop").addEventListener("input", handleSearch);
document.getElementById("qMobile").addEventListener("input", handleSearch);

document.querySelectorAll(".tagChip").forEach(btn => {
  btn.addEventListener("click", () => {
    const tag = btn.getAttribute("data-tag");
    const active = state.activeTags.has(tag);
    if (active) state.activeTags.delete(tag); else state.activeTags.add(tag);
    btn.classList.toggle("border-primary", !active); btn.classList.toggle("text-primary", !active); btn.classList.toggle("bg-primary/10", !active);
    page = 1; syncAll();
  });
});

document.getElementById("btnNearMe").addEventListener("click", () => {
  if (location.protocol !== "https:" && location.hostname !== "localhost") { alert("Near Me 需要 HTTPS。"); return; }
  if (!navigator.geolocation) return alert("不支援定位");
  navigator.geolocation.getCurrentPosition(pos => {
    state.userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    state.nearMeMode = true;
    setUserMarker(state.userLoc.lat, state.userLoc.lng);
    mapDesktop.setView([state.userLoc.lat, state.userLoc.lng], 15);
    mapMobile.setView([state.userLoc.lat, state.userLoc.lng], 15);
    syncAll();
  }, err => alert("定位失敗"));
});

document.getElementById("btnLocateDesktop").addEventListener("click", () => document.getElementById("btnNearMe").click());
document.getElementById("btnLocateMobile").addEventListener("click", () => document.getElementById("btnNearMe").click());
document.getElementById("btnZoomInDesktop").addEventListener("click", () => mapDesktop.zoomIn());
document.getElementById("btnZoomOutDesktop").addEventListener("click", () => mapDesktop.zoomOut());
document.getElementById("btnZoomInMobile").addEventListener("click", () => mapMobile.zoomIn());
document.getElementById("btnZoomOutMobile").addEventListener("click", () => mapMobile.zoomOut());

document.getElementById("btnHasCoords").addEventListener("click", (e) => {
  state.requireCoords = !state.requireCoords;
  e.currentTarget.classList.toggle("border-primary", state.requireCoords); e.currentTarget.classList.toggle("text-primary", state.requireCoords); e.currentTarget.classList.toggle("bg-primary/10", state.requireCoords);
  page = 1; syncAll();
});

document.getElementById("btnReset").addEventListener("click", () => {
  state.q = ""; state.activeTags.clear(); state.nearMeMode = false; state.userLoc = null; state.requireCoords = false; page = 1;
  document.getElementById("qTop").value = ""; document.getElementById("qMobile").value = "";
  document.querySelectorAll(".tagChip").forEach(btn => btn.classList.remove("border-primary", "text-primary", "bg-primary/10"));
  document.getElementById("btnHasCoords").classList.remove("border-primary","text-primary","bg-primary/10");
  syncAll();
});

document.getElementById("btnLoadMore").addEventListener("click", () => { page += 1; syncAll(); });

document.getElementById("list").addEventListener("click", (e) => {
  const favBtn = e.target.closest(".btnFav");
  if (favBtn) {
    e.stopPropagation(); const id = favBtn.getAttribute("data-fav"); const favs = getFavSet();
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavSet(favs); syncAll(); return;
  }
  const card = e.target.closest(".salonCard");
  if (card) {
    const id = card.getAttribute("data-id"); const s = SALONS.find(x => x.id === id);
    if (s && Number.isFinite(s.lat) && Number.isFinite(s.lng)) {
      mapDesktop.setView([s.lat, s.lng], 17); mapMobile.setView([s.lat, s.lng], 17);
      layerDesktop.eachLayer(l => { if (l._salonId === id) l.openPopup(); }); layerMobile.eachLayer(l => { if (l._salonId === id) l.openPopup(); });
      if (window.innerWidth < 768) document.getElementById("tabMap").click();
    } else { alert("此店暫無座標"); }
  }
});

const panelList = document.getElementById("panelList");
const panelMapMobile = document.getElementById("panelMapMobile");
const tabList = document.getElementById("tabList");
const tabMap = document.getElementById("tabMap");

tabList.addEventListener("click", () => {
  panelList.classList.remove("hidden"); panelMapMobile.classList.add("hidden");
  tabList.classList.add("bg-text-main","text-white"); tabList.classList.remove("text-text-main");
  tabMap.classList.remove("bg-text-main","text-white"); tabMap.classList.add("text-text-main");
});

tabMap.addEventListener("click", () => {
  panelList.classList.add("hidden"); panelMapMobile.classList.remove("hidden");
  tabMap.classList.add("bg-text-main","text-white"); tabMap.classList.remove("text-text-main");
  tabList.classList.remove("bg-text-main","text-white"); tabList.classList.add("text-text-main");
  requestAnimationFrame(() => {
    mapMobile.invalidateSize();
    const items = getFiltered().filter(s => Number.isFinite(s.lat));
    if (items.length) {
      const bounds = L.latLngBounds(items.map(s => [s.lat, s.lng]));
      mapMobile.fitBounds(bounds, { padding: [50,50], maxZoom: 16 });
    }
  });
});

window.addEventListener("resize", () => { requestAnimationFrame(() => { mapDesktop.invalidateSize(); mapMobile.invalidateSize(); }); });

/* =========================
   Boot
========================= */
async function load() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    let rows = Array.isArray(data) ? data : (data.salons || []);
    
    // 🛠️ DEBUG: 強制印出 API 資料讓使用者檢查
    if (rows.length > 0) {
      console.log("🔥 [DEBUG] API 回傳的第一筆資料:", rows[0]);
    }

    SALONS = rows.map(normalizeSalon);
    
    const warns = (data.warnings || []);
    if (warns.length) {
      document.getElementById("bannerWarn").classList.remove("hidden");
      document.getElementById("warnText").textContent = `Warnings: ${warns.length} items (Check Console)`;
      console.warn(warns);
    }
    syncAll();
  } catch (e) { console.error(e); alert("Load failed: " + e.message); }
}

load();
</script>
</body>
</html>
