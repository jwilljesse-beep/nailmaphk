            primary: "#EF9FA9",
            "primary-hover": "#E57A85",
            tertiary: "#D32F2F",

          </button>
          <button id="btnZoomOut"

      <div class="absolute top-4 left-4 z-[1000]">

          <input id="chkMoveSearch" checked class="form-checkbox rounded text-primary border-gray-300 focus:ring-primary h-4 w-4" type="checkbox" />
          <span>Auto fit to results</span>

  <!-- Mobile bottom toggle -->
  <div class="lg:hidden fixed bottom-3 left-1/2 -translate-x-1/2 z-[1200]">
    <div class="bg-white border border-border-subtle shadow-lg rounded-full flex overflow-hidden">
      <button id="btnTabList" class="px-5 py-2 text-sm font-semibold text-text-main hover:bg-background-light inline-flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">list</span> List
      </button>
      <button id="btnTabMap" class="px-5 py-2 text-sm font-semibold text-text-main hover:bg-background-light inline-flex items-center gap-2 border-l border-border-subtle">
        <span class="material-symbols-outlined text-[18px]">map</span> Map
      </button>
    </div>
  </div>

<script>
/* =========================
   CONFIG
========================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwOFC2Dj31_WGgI2C0S7RGr74ueVQ3Z3rkEIzoFtW12El_VMgW-afwGAToEZrKLEnyh2A/exec";
const AUTO_REFRESH_MS = 5 * 60 * 1000;

/* =========================
   FAVORITES (localStorage)
========================= */
const FAV_KEY = "nailmap_favs_v1";
function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveFavs(set) {
  localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
}
let favs = loadFavs();

/* =========================
   STATE
========================= */
let SALONS = []; // from Sheets
let state = {
  q: "",
  activeTags: new Set(),
  userLoc: null,
  nearMeMode: false,
};

/* =========================
   HELPERS
========================= */
function escapeHtml(str="") {
  return String(str).replace(/[&<>"']/g, (m) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[m]));
}

function normalizeText(s="") {
  return String(s)
    .toLowerCase()
    .replace(/\s+/g, " ")
    .replace(/[’'"]/g, "")
    .replace(/[\-_/]+/g, " ")
    .trim();
}

function formatDateYYYYMMDD(value) {
  if (!value) return "";
  if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value.trim())) return value.trim();
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

function formatPriceLabel(s) {
  const min = (s.price_tier_min || "").trim();
  const max = (s.price_tier_max || "").trim();
  const tier = (min && max) ? `${min}–${max}` : (s.priceTier || "");
  const range = (s.price_range_hkd || "").trim();
  const rangeLabel = range ? `（HKD${range}）` : "";
  return (tier ? tier + " " : "") + rangeLabel;
}

function haversineKm(aLat, aLng, bLat, bLng) {
  const R = 6371;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(bLat - aLat);
  const dLng = toRad(bLng - aLng);
  const s1 = Math.sin(dLat/2) ** 2;
  const s2 = Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * (Math.sin(dLng/2) ** 2);
  return 2 * R * Math.asin(Math.sqrt(s1 + s2));
}

function matchesQuery(salon, q) {
  if (!q) return true;
  const qq = normalizeText(q);

  const aliasText = Array.isArray(salon.aliases) ? salon.aliases.join(" ") : (salon.aliases || "");
  const hay = normalizeText([
    salon.name,
    salon.district,
    salon.district_en || "",
    salon.addressText,
    salon.address_en || "",
    salon.note,
    salon.priceTier,
    formatPriceLabel(salon),
    ...(salon.tags || []),
    aliasText
  ].join(" "));

  return hay.includes(qq);
}

function matchesTags(salon, tagsSet) {
  if (tagsSet.size === 0) return true;
  const t = new Set(salon.tags || []);
  for (const tag of tagsSet) {
    if (!t.has(tag)) return false;
  }
  return true;
}

function getFiltered() {
  let items = SALONS
    .filter(s => matchesQuery(s, state.q))
    .filter(s => matchesTags(s, state.activeTags));

  if (state.nearMeMode && state.userLoc) {
    items = items
      .map(s => {
        if (s.lat == null || s.lng == null) return { ...s, _km: null };
        return { ...s, _km: haversineKm(state.userLoc.lat, state.userLoc.lng, s.lat, s.lng) };
      })
      .sort((a,b) => {
        if (a._km == null && b._km == null) return 0;
        if (a._km == null) return 1;
        if (b._km == null) return -1;
        return a._km - b._km;
      });
  }
  return items;
}

/* =========================
   MAP (Leaflet)
========================= */
const map = L.map("map", { zoomControl: false }).setView([22.334, 114.148], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const markerLayer = L.layerGroup().addTo(map);
let userMarker = null;

function setUserMarker(lat, lng) {
  if (userMarker) markerLayer.removeLayer(userMarker);
  userMarker = L.circleMarker([lat, lng], {
    radius: 8,
    weight: 2,
    fillOpacity: 0.25
  }).addTo(markerLayer);
  userMarker.bindPopup("<b>你而家位置</b><br/>（只作附近搜尋用途）");
}

function renderMarkers(items) {
  markerLayer.clearLayers();
  if (state.userLoc) setUserMarker(state.userLoc.lat, state.userLoc.lng);

  items.forEach(s => {
    if (s.lat == null || s.lng == null) return; // no marker if no coords

    const m = L.marker([s.lat, s.lng]).addTo(markerLayer);

    const tags = (s.tags || []).slice(0, 6).map(t =>
      `<span style="display:inline-block;margin:2px 4px 0 0;padding:2px 6px;border:1px solid #EBDAD4;border-radius:999px;font-size:11px;">${escapeHtml(t)}</span>`
    ).join("");

    const src = s.sourceUrl
      ? `<div style="margin-top:8px;"><a href="${s.sourceUrl}" target="_blank" rel="noopener" style="color:#E57A85;text-decoration:underline;">Source</a></div>`
      : "";

    const price = formatPriceLabel(s);

    m.bindPopup(`
      <div style="min-width:240px;">
        <div style="font-weight:800;font-size:15px;color:#543D37;">${escapeHtml(s.name)}</div>
        <div style="margin-top:4px;font-size:12px;color:#99827D;">${escapeHtml(s.district)} ${price ? " • " + escapeHtml(price) : ""}</div>
        <div style="margin-top:8px;font-size:13px;color:#543D37;">
          <b>位置（大概）</b>：${escapeHtml(s.addressText || "—")}
        </div>
        <div style="margin-top:8px;">${tags}</div>
        <div style="margin-top:10px;font-size:11px;color:#99827D;">
          商廈/工作室：僅顯示大概位置；到訪地址以店方確認為準
        </div>
        ${src}
      </div>
    `);

    m._salonId = s.id;
  });
}

/* =========================
   LIST RENDER
========================= */
function sourceLine(s) {
  const show = String(s.show_updated || "").toLowerCase().trim() === "yes";
  const updated = (show && s.lastVerified) ? `Updated: ${s.lastVerified}` : "";

  const src = s.sourceUrl
    ? `<a class="text-xs text-primary-hover hover:underline" href="${s.sourceUrl}" target="_blank" rel="noopener">Source</a>`
    : `<span class="text-xs text-text-subtle">Source: —</span>`;

  return `<div class="mt-2 flex items-center justify-end gap-3">
    ${src}
    ${updated ? `<span class="text-xs text-text-subtle">${escapeHtml(updated)}</span>` : ``}
  </div>`;
}

function privacyNoteByLocationType(locationType) {
  // locationType already normalized by script, but be defensive
  const t = String(locationType || "").toLowerCase();
  if (t === "mall" || t === "street") return "公開地址可列明；到訪地址以店方確認為準";
  return "商廈/工作室：僅顯示大概位置；到訪地址以店方確認為準";
}

let listLimit = 60;
function renderList(items) {
  const list = document.getElementById("list");
  const showing = items.slice(0, listLimit);

  list.innerHTML = showing.map(s => {
    const isFav = favs.has(s.id);
    const heartClass = isFav ? "text-tertiary" : "text-text-subtle";

    const distance = (state.nearMeMode && state.userLoc && s._km != null)
      ? `<span class="text-xs font-semibold text-text-subtle">${s._km.toFixed(2)} km</span>`
      : (state.nearMeMode && state.userLoc && s._km == null)
        ? `<span class="text-xs font-semibold text-text-subtle">— km</span>`
        : "";

    const price = formatPriceLabel(s);

    const tags = (s.tags || []).slice(0, 6).map(t => `
      <span class="px-2 py-1 bg-background-light rounded text-xs font-medium text-text-subtle">${escapeHtml(t)}</span>
    `).join("");

    const privacy = privacyNoteByLocationType(s.location_type);

    return `
      <article data-id="${escapeHtml(s.id)}"
        class="salonCard group relative bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-all border border-transparent hover:border-primary/20 cursor-pointer">
        <div class="flex flex-col gap-3">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="text-lg font-extrabold text-text-main leading-tight group-hover:text-primary-hover transition-colors">
                ${escapeHtml(s.name)}
              </h3>
              <p class="text-text-subtle text-sm mt-1">
                ${escapeHtml(s.district)}${price ? " • " + escapeHtml(price) : ""}
              </p>
            </div>
            <div class="flex flex-col items-end gap-1">
              ${distance}
              <button type="button" class="favBtn p-1.5 bg-white border border-border-subtle rounded-full hover:bg-background-light" data-id="${escapeHtml(s.id)}" aria-label="favorite">
                <span class="material-symbols-outlined ${heartClass} text-[18px]">favorite</span>
              </button>
            </div>
          </div>

          ${tags ? `<div class="flex flex-wrap gap-2">${tags}</div>` : ``}

          <div class="pt-3 border-t border-background-light">
            <div class="text-sm text-text-main">
              <span class="material-symbols-outlined align-[-5px] text-[18px] text-text-subtle">location_on</span>
              ${escapeHtml(s.addressText || "—")}
            </div>
            ${s.note ? `<div class="text-xs text-text-subtle mt-1">${escapeHtml(s.note)}</div>` : ``}

            <p class="text-[11px] text-text-subtle flex items-start gap-1.5 leading-snug mt-2">
              <span class="material-symbols-outlined text-[14px] shrink-0 translate-y-[1px]">info</span>
              ${escapeHtml(privacy)}
            </p>

            ${sourceLine(s)}
          </div>
        </div>
      </article>
    `;
  }).join("");

  document.getElementById("countText").textContent = items.length;

  const btnLoadMore = document.getElementById("btnLoadMore");
  btnLoadMore.disabled = (listLimit >= items.length);
  btnLoadMore.style.opacity = btnLoadMore.disabled ? "0.4" : "1";
}

/* =========================
   SYNC
========================= */
function syncAll() {
  const items = getFiltered();
  renderList(items);
  renderMarkers(items);

  const moveSearch = document.getElementById("chkMoveSearch")?.checked;
  if (moveSearch && items.length > 0) {
    const pts = items
      .filter(s => s.lat != null && s.lng != null)
      .map(s => [s.lat, s.lng]);

    if (pts.length > 0) {
      const bounds = L.latLngBounds(pts);
      map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
    }
  }
}

/* =========================
   MOBILE PANEL TOGGLE
========================= */
function isMobile() { return window.matchMedia("(max-width: 1023px)").matches; }

function showPanel(which) {
  const list = document.getElementById("panelList");
  const mapPanel = document.getElementById("panelMap");
  if (!isMobile()) return;

  if (which === "map") {
    list.classList.add("hidden");
    mapPanel.classList.remove("hidden");
    mapPanel.classList.add("block");

    // Leaflet needs invalidateSize after becoming visible
    setTimeout(() => {
      try {
        map.invalidateSize(true);
        setTimeout(() => map.invalidateSize(true), 120);
      } catch (e) {}
    }, 80);

  } else {
    mapPanel.classList.add("hidden");
    mapPanel.classList.remove("block");
    list.classList.remove("hidden");
  }
}

/* =========================
   EVENTS
========================= */
function setQuery(q) {
  state.q = q || "";
  listLimit = 60;
  syncAll();
}

document.getElementById("qTop").addEventListener("input", e => setQuery(e.target.value));
document.getElementById("qMobile").addEventListener("input", e => setQuery(e.target.value));

document.querySelectorAll(".tagChip").forEach(btn => {
  btn.addEventListener("click", () => {
    const tag = btn.getAttribute("data-tag");
    const active = state.activeTags.has(tag);
    if (active) state.activeTags.delete(tag);
    else state.activeTags.add(tag);

    // visual toggle
    btn.classList.toggle("border-primary", !active);
    btn.classList.toggle("text-primary", !active);
    btn.classList.toggle("bg-primary/10", !active);

    listLimit = 60;
    syncAll();
  });
});

document.getElementById("btnReset").addEventListener("click", () => {
  state.q = "";
  state.activeTags.clear();
  state.nearMeMode = false;

  document.getElementById("qTop").value = "";
  document.getElementById("qMobile").value = "";

  document.querySelectorAll(".tagChip").forEach(btn => {
    btn.classList.remove("border-primary", "text-primary", "bg-primary/10");
  });

  listLimit = 60;
  syncAll();
});

document.getElementById("btnLoadMore").addEventListener("click", () => {
  listLimit += 60;
  syncAll();
});

// Map controls
document.getElementById("btnZoomIn").addEventListener("click", () => map.zoomIn());
document.getElementById("btnZoomOut").addEventListener("click", () => map.zoomOut());

// Mobile tabs
document.getElementById("btnTabList").addEventListener("click", () => showPanel("list"));
document.getElementById("btnTabMap").addEventListener("click", () => showPanel("map"));

// Favorites + card click
document.getElementById("list").addEventListener("click", (e) => {
  const favBtn = e.target.closest(".favBtn");
  if (favBtn) {
    e.stopPropagation();
    const id = favBtn.getAttribute("data-id");
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavs(favs);
    syncAll();
    return;
  }

  const card = e.target.closest(".salonCard");
  if (!card) return;
  const id = card.getAttribute("data-id");
  const items = getFiltered();
  const s = items.find(x => x.id === id);
  if (!s) return;

  // switch to map on mobile
  if (isMobile()) showPanel("map");

  // focus map if coordinates exist
  if (s.lat != null && s.lng != null) {
    map.setView([s.lat, s.lng], 16);
    markerLayer.eachLayer(layer => {
      if (layer._salonId === id) layer.openPopup();
    });
  } else {
    // no coords: just open a gentle note
    alert("呢間店暫未有座標，所以地圖未能標示（list 仍可正常使用）。");
  }
});

/* =========================
   GEOLOCATION
========================= */
function requestGeolocation() {
  if (!navigator.geolocation) {
    alert("你的瀏覽器不支援定位功能。");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.nearMeMode = true;
      setUserMarker(state.userLoc.lat, state.userLoc.lng);
      map.setView([state.userLoc.lat, state.userLoc.lng], 15);
      syncAll();
    },
    (err) => {
      console.warn(err);
      alert("未能取得你的位置（可能未授權定位）。");
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}
document.getElementById("btnNearMe").addEventListener("click", () => requestGeolocation());
document.getElementById("btnLocate").addEventListener("click", () => requestGeolocation());

/* =========================
   LOAD DATA FROM SHEETS
   Supports both:
   - array (legacy)
   - { meta, errors, warnings, data } (new script)
========================= */
function mapSheetToUI(s) {
  // Defensively map fields; tolerate missing columns
  const tags = Array.isArray(s.tags) ? s.tags : [];
  const aliases = Array.isArray(s.aliases) ? s.aliases : [];

  return {
    id: String(s.id || "").trim(),
    name: String(s.name || "").trim(),
    district: String(s.district || "").trim(),
    district_en: String(s.district_en || "").trim(),
    area_group: String(s.area_group || "").trim(),
    location_type: String(s.location_type || "").trim(),
    lat: (s.lat === "" || s.lat == null || Number.isNaN(Number(s.lat))) ? null : Number(s.lat),
    lng: (s.lng === "" || s.lng == null || Number.isNaN(Number(s.lng))) ? null : Number(s.lng),

    price_tier_min: String(s.price_tier_min || "").trim(),
    price_tier_max: String(s.price_tier_max || "").trim(),
    price_range_hkd: String(s.price_range_hkd || "").trim(),

    // compatibility:
    priceTier: String(s.price_tier || s.priceTier || "").trim(),

    tags,
    aliases,
    addressText: String(s.address_display || s.addressText || "").trim(),
    address_en: String(s.address_en || "").trim(),
    note: String(s.note || "").trim(),
    sourceUrl: String(s.source_url || s.sourceUrl || "").trim(),

    show_updated: (s.show_updated === true) ? "yes" : String(s.show_updated || "").trim(),
    lastVerified: formatDateYYYYMMDD(s.last_verified || s.lastVerified || "")
  };
}

function showSystemBanner(metaText) {
  const box = document.getElementById("sysBanner");
  const meta = document.getElementById("sysBannerMeta");
  meta.textContent = metaText || "";
  box.classList.remove("hidden");
}

async function loadSalonsFromSheet() {
  const res = await fetch(API_URL, { cache: "no-store" });
  if (!res.ok) throw new Error("Failed to load data: " + res.status);

  const json = await res.json();

  let arr = [];
  let errors = [];
  let warnings = [];

  if (Array.isArray(json)) {
    arr = json;
  } else if (json && Array.isArray(json.data)) {
    arr = json.data;
    errors = Array.isArray(json.errors) ? json.errors : [];
    warnings = Array.isArray(json.warnings) ? json.warnings : [];
  } else {
    throw new Error("API response format not recognized");
  }

  // Console logs for developer
  if (errors.length) console.error("Errors:", errors);
  if (warnings.length) console.warn("Warnings:", warnings);

  // Show banner only if errors exist
  if (errors.length) {
    showSystemBanner(`Errors: ${errors.length}｜Warnings: ${warnings.length}｜請打開 Console 查看詳情。`);
  }

  SALONS = arr
    .map(mapSheetToUI)
    .filter(s => s.id && s.name); // basic safety

  // If first load, set a reasonable map view to HK
  if (SALONS.length > 0) {
    const pts = SALONS.filter(s => s.lat != null && s.lng != null).map(s => [s.lat, s.lng]);
    if (pts.length > 0) {
      const bounds = L.latLngBounds(pts);
      map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
    }
  }

  syncAll();
}

// Initial load
loadSalonsFromSheet().catch(err => {
  console.error(err);
  alert("讀取資料失敗：請檢查 Apps Script Web App 權限或 API_URL。");
});

// Auto refresh
setInterval(() => loadSalonsFromSheet().catch(console.error), AUTO_REFRESH_MS);
