<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>NailMap HK (Debug Ver)</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#EF9FA9",
            "primary-hover": "#E57A85",
            tertiary: "#D32F2F",
            "background-light": "#FAF8F6",
            "text-main": "#543D37",
            "text-subtle": "#99827D",
            "border-subtle": "#EBDAD4",
            "white-overlay": "#ffffff",
          },
          borderRadius: { DEFAULT: "0.5rem", lg: "1rem", xl: "1.5rem", full: "9999px" },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet">

  <style>
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #EBDAD4; border-radius: 10px; }
    #mapDesktop, #mapMobile { width: 100%; height: 100%; z-index: 1; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="bg-background-light text-text-main flex flex-col h-dvh overflow-hidden">
  
  <header class="flex-none z-20 bg-white-overlay border-b border-border-subtle px-4 py-3">
    <div class="flex items-center gap-3">
      <div class="size-9 text-primary bg-background-light rounded-full flex items-center justify-center border border-border-subtle">
        <span class="material-symbols-outlined" style="font-size: 20px;">spa</span>
      </div>
      <div>
        <div class="text-lg font-extrabold tracking-tight">NailMap HK</div>
        <div class="text-[10px] text-text-subtle">香港美甲店資料庫</div>
      </div>
    </div>
  </header>

  <main class="flex-1 min-h-0 flex overflow-hidden relative">
    
    <section id="panelList" class="w-full md:w-[50%] h-full bg-background-light flex flex-col z-10 shadow-xl">
      <div class="flex-none px-4 py-4 bg-white/80 backdrop-blur border-b border-border-subtle flex flex-col gap-3">
        <input id="qInput" class="w-full h-11 rounded-xl border border-border-subtle bg-white pl-4 text-sm focus:ring-2 focus:ring-primary/20" placeholder="搜尋：店名 / 地區 / Tag..." />
        
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
           <button id="btnNearMe" class="h-8 px-3 rounded-full bg-white border border-border-subtle text-xs font-medium whitespace-nowrap">Near Me</button>
           <button data-tag="Soft Gel" class="tagChip h-8 px-3 rounded-full bg-white border border-border-subtle text-xs font-medium whitespace-nowrap">Soft Gel</button>
           <button data-tag="Hard Gel" class="tagChip h-8 px-3 rounded-full bg-white border border-border-subtle text-xs font-medium whitespace-nowrap">Hard Gel</button>
           <button data-tag="Nail Art" class="tagChip h-8 px-3 rounded-full bg-white border border-border-subtle text-xs font-medium whitespace-nowrap">Nail Art</button>
        </div>

        <div class="flex justify-between items-center text-xs text-text-subtle">
          <span id="countText">Loading...</span>
          <button id="btnReset" class="flex items-center gap-1 hover:text-text-main">
            <span class="material-symbols-outlined text-[16px]">restart_alt</span> Reset
          </button>
        </div>
        
        <div id="debugBanner" class="hidden text-[10px] bg-red-50 text-red-600 p-2 rounded"></div>
      </div>

      <div id="list" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 overscroll-contain"></div>
    </section>

    <section class="hidden md:block md:w-[50%] h-full relative">
      <div id="mapDesktop"></div>
    </section>
  </main>

<script>
/* =========================
   1. CONFIG
========================= */
// 請確認這是你最新的 Web App URL
const API_URL = "https://script.google.com/macros/s/AKfycbwOFC2Dj31_WGgI2C0S7RGr74ueVQ3Z3rkEIzoFtW12El_VMgW-afwGAToEZrKLEnyh2A/exec";

/* =========================
   2. CORE LOGIC
========================= */

// Robust Field Reader (這是修正的關鍵)
// 它會嘗試讀取各種可能的欄位名稱
function getVal(obj, keys) {
  for (const k of keys) {
    if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== "") {
      return String(obj[k]).trim();
    }
  }
  return "";
}

function normalizeSalon(raw) {
  const s = { ...raw };
  
  s.id = getVal(raw, ["id", "ID"]);
  s.name = getVal(raw, ["name", "Name", "shop_name"]);
  s.district = getVal(raw, ["district", "District"]);
  s.district_en = getVal(raw, ["district_en", "districtEn"]);
  
  // ✅ 價格欄位修正：增加更多可能的 Key
  s.price_tier_min = getVal(raw, ["price_tier_min", "priceTierMin", "Price Tier Min", "min_price"]);
  s.price_tier_max = getVal(raw, ["price_tier_max", "priceTierMax", "Price Tier Max", "max_price"]);
  s.price_range_hkd = getVal(raw, ["price_range_hkd", "priceRangeHkd", "Price Range HKD", "price_range"]);

  s.lat = Number(getVal(raw, ["lat", "Lat"]));
  s.lng = Number(getVal(raw, ["lng", "Lng"]));
  
  // Tags
  const t = getVal(raw, ["tags", "Tags"]);
  s.tags = t ? t.split(/[,，]/).map(x => x.trim()).filter(Boolean) : [];
  
  s.address_display = getVal(raw, ["address_display", "address"]);
  s.source_url = getVal(raw, ["source_url", "url"]);
  
  return s;
}

// ✅ 顯示邏輯修正：確保不回傳奇怪的 HKD 字串
function formatPriceDisplay(s) {
  const min = s.price_tier_min; // e.g., "$"
  const max = s.price_tier_max; // e.g., "$$$"
  const range = s.price_range_hkd; // e.g., "300-800"

  // 1. 處理 Tier ($ - $$$)
  let tier = "";
  if (min && max) {
    tier = (min === max) ? min : (min.length < max.length ? `${min}-${max}` : `${max}-${min}`);
  } else {
    tier = min || max;
  }

  // 2. 處理 Range (HKD 300-800)
  let rangeStr = "";
  if (range) {
    // 移除現有的 "HKD" 字眼，統一格式
    const clean = range.replace(/HKD/gi, "").replace(/[-－—]/g, "－").trim();
    if (clean) rangeStr = `HKD${clean}`;
  }

  // 3. 組合
  if (tier && rangeStr) return `${tier}（${rangeStr}）`;
  if (tier) return tier;
  if (rangeStr) return rangeStr;
  
  return ""; // 沒有價格資料
}

/* =========================
   3. RENDERING
========================= */
let SALONS = [];

function renderList(items) {
  const list = document.getElementById("list");
  
  // Debug: 印出前 3 筆的價格資料到 Console
  if (items.length > 0) {
    console.log("🔍 Debug Pricing (Top 3 Items):");
    items.slice(0, 3).forEach(s => {
      console.log(`店名: ${s.name} | Min: ${s.price_tier_min} | Max: ${s.price_tier_max} | Range: ${s.price_range_hkd} | Result: ${formatPriceDisplay(s)}`);
    });
  }

  list.innerHTML = items.map(s => {
    const price = formatPriceDisplay(s);
    const tags = s.tags.slice(0, 4).map(t => `<span class="bg-gray-100 text-text-subtle text-[10px] px-2 py-1 rounded">${t}</span>`).join("");
    
    // 如果有價格，字體加粗顯示；如果無，不顯示
    const priceHtml = price 
      ? `<span class="text-text-main font-bold ml-1 text-xs bg-primary/10 px-1.5 py-0.5 rounded">${price}</span>` 
      : "";

    return `
      <div class="bg-white p-4 rounded-xl shadow-sm border border-transparent hover:border-primary/30 transition-all cursor-pointer">
        <div class="flex justify-between items-start">
          <h3 class="font-bold text-text-main text-base">${s.name}</h3>
        </div>
        
        <div class="text-xs text-text-subtle mt-1 flex items-center flex-wrap gap-1">
          <span>${s.district || "—"}</span>
          ${priceHtml}
        </div>

        <div class="flex gap-2 mt-2 flex-wrap">${tags}</div>
        
        <div class="mt-3 pt-2 border-t border-gray-100 text-[11px] text-text-subtle">
           📍 ${s.address_display || "地址不詳"}
        </div>
      </div>
    `;
  }).join("");
  
  document.getElementById("countText").textContent = `${items.length} 結果`;
}

/* =========================
   4. INIT & FETCH
========================= */
async function load() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    
    // 支援 { salons: [] } 或直接 []
    const rawList = Array.isArray(data) ? data : (data.salons || []);
    
    // 檢查 API 是否回傳了價格欄位
    if (rawList.length > 0) {
      const first = rawList[0];
      const hasPriceKey = Object.keys(first).some(k => k.toLowerCase().includes("price"));
      if (!hasPriceKey) {
        document.getElementById("debugBanner").textContent = "⚠️ 警告：API 回傳的資料中找不到 'price' 相關欄位。請檢查 Google Script 是否已發布 (New Deployment)。";
        document.getElementById("debugBanner").classList.remove("hidden");
        console.warn("API Data Sample:", first);
      }
    }

    SALONS = rawList.map(normalizeSalon);
    renderList(SALONS);
    
    // 初始化地圖 (簡化版)
    initMap(SALONS);

  } catch (e) {
    console.error(e);
    alert("載入失敗，請看 Console 錯誤訊息");
  }
}

// 簡易 Map init，避免前面複雜邏輯干擾
function initMap(items) {
  const map = L.map('mapDesktop').setView([22.3369, 114.1476], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  
  items.filter(s => s.lat && s.lng).forEach(s => {
    L.circleMarker([s.lat, s.lng], { color: '#EF9FA9', radius: 6 }).addTo(map)
      .bindPopup(`<b>${s.name}</b><br>${formatPriceDisplay(s)}`);
  });
}

// Search Logic
document.getElementById("qInput").addEventListener("input", (e) => {
  const v = e.target.value.toLowerCase();
  const filtered = SALONS.filter(s => 
    (s.name + s.district + s.tags.join("")).toLowerCase().includes(v)
  );
  renderList(filtered);
});

load();

</script>
</body>
</html>
