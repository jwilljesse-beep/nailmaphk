<script>
/* =========================
   ✅ CONFIG
========================= */
// 你提供嘅 Web App exec
const API_URL = "https://script.google.com/macros/s/AKfycbwOFC2Dj31_WGgI2C0S7RGr74ueVQ3Z3rkEIzoFtW12El_VMgW-afwGAToEZrKLEnyh2A/exec";

/* =========================
   ✅ Helpers
========================= */
function norm(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\u4e00-\u9fff]+/g, " ") // keep CJK
    .replace(/\s+/g, " ")
    .trim();
}

function splitList(v) {
  if (Array.isArray(v)) return v.map(x => String(x).trim()).filter(Boolean);
  const s = String(v || "").trim();
  if (!s) return [];
  return s.split(",").map(x => x.trim()).filter(Boolean);
}

function toBool(v) {
  const s = String(v || "").toLowerCase().trim();
  return s === "yes" || s === "true" || s === "1";
}

function toNum(v) {
  if (v === "" || v == null) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function priceTierToNum(t) { return (t || "").trim().length; } // $=1, $$=2...

function formatPriceDisplay(s) {
  const minTier = (s.price_tier_min || "").trim();
  const maxTier = (s.price_tier_max || "").trim();
  const range = (s.price_range_hkd || "").trim(); // e.g. "300–800"

  let tierText = "";
  if (minTier && maxTier) {
    const a = priceTierToNum(minTier);
    const b = priceTierToNum(maxTier);
    if (a === b) tierText = minTier;
    else tierText = (a < b) ? `${minTier}-${maxTier}` : `${maxTier}-${minTier}`;
  } else if (minTier || maxTier) {
    tierText = (minTier || maxTier);
  }

  if (!tierText) return "";
  if (range) {
    const r = range.replace(/–/g, "－").replace(/-/g, "－");
    return `${tierText}（HKD${r}）`;
  }
  return tierText;
}

function escapeHtml(str="") {
  return String(str).replace(/[&<>"']/g, (m) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[m]));
}

function haversineKm(aLat, aLng, bLat, bLng) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(bLat - aLat);
  const dLng = toRad(bLng - aLng);
  const s1 = Math.sin(dLat/2) ** 2;
  const s2 = Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * (Math.sin(dLng/2) ** 2);
  return 2 * R * Math.asin(Math.sqrt(s1 + s2));
}

/* =========================
   ✅ EN/ZH District Synonyms
   (包含你提到嘅 "lai chi lok" typo)
========================= */
const DISTRICT_SYNONYMS = [
  { en: ["laichikok", "lai chi kok", "laichilok", "lai chi lok", "lck"], zh: ["荔枝角"] },
  { en: ["cheungshawan", "cheung sha wan", "changshawan", "csw"], zh: ["長沙灣"] },
  { en: ["shamshuipo", "sham shui po", "ssp"], zh: ["深水埗"] },
  { en: ["mongkok", "mong kok", "mk"], zh: ["旺角"] },
  { en: ["tsimshatsui", "tsim sha tsui", "tst"], zh: ["尖沙咀"] },
  { en: ["causewaybay", "causeway bay", "cwb"], zh: ["銅鑼灣"] },
  { en: ["wanchai", "wan chai"], zh: ["灣仔"] },
  { en: ["central"], zh: ["中環"] },
  { en: ["sheungwan", "sheung wan"], zh: ["上環"] },
];

function expandQueryVariants(q) {
  const raw = String(q || "");
  const n = norm(raw);
  if (!n) return [];
  const vars = new Set([n]);

  for (const item of DISTRICT_SYNONYMS) {
    const enHit = item.en.some(k => n.includes(norm(k)));
    const zhHit = item.zh.some(z => n.includes(norm(z)));
    if (enHit) item.zh.forEach(z => vars.add(norm(z)));
    if (zhHit) item.en.forEach(k => vars.add(norm(k)));
  }
  return [...vars];
}

/* =========================
   ✅ Favorites (localStorage)
========================= */
const FAV_KEY = "nailmap_favs_v1";
function getFavSet() {
  try {
    const arr = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
    return new Set(Array.isArray(arr) ? arr : []);
  } catch { return new Set(); }
}
function saveFavSet(set) {
  localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
}

/* =========================
   ✅ Data + Validation
========================= */
let SALONS = [];
let VALIDATION = { errors: [], warnings: [] };

function validateSalons(rows) {
  const errors = [];
  const warnings = [];
  const seen = new Set();

  const allowedLocationTypes = new Set([
    "Building","Mall","Street","Home","Studio","Pop-up","Academy","Other",
    "商廈","商場","街舖","住宅","工作室","快閃","學院","其他"
  ]);

  rows.forEach((s, idx) => {
    const rowNum = idx + 2; // assume row1 header
    const id = String(s.id || "").trim();
    if (!id) errors.push({ row: rowNum, type: "missing_id" });
    if (id) {
      if (seen.has(id)) errors.push({ row: rowNum, type: "duplicate_id", id });
      seen.add(id);
    }

    const lt = String(s.location_type || "").trim();
    if (lt && !allowedLocationTypes.has(lt)) {
      warnings.push({ row: rowNum, type: "bad_location_type", location_type: lt });
    }
  });

  return { errors, warnings };
}

function normalizeSalon(raw) {
  const s = { ...raw };

  s.id = String(s.id || "").trim();
  s.name = String(s.name || "").trim();
  s.district = String(s.district || "").trim();
  s.district_en = String(s.district_en || "").trim();
  s.area_group = String(s.area_group || "").trim();
  s.location_type = String(s.location_type || "").trim();

  s.lat = toNum(s.lat);
  s.lng = toNum(s.lng);

  s.price_tier_min = String(s.price_tier_min || "").trim();
  s.price_tier_max = String(s.price_tier_max || "").trim();
  s.price_range_hkd = String(s.price_range_hkd || "").trim();

  s.tags = splitList(s.tags);
  s.aliases = splitList(s.aliases);

  s.address_display = String(s.address_display || "").trim();
  s.note = String(s.note || "").trim();
  s.source_url = String(s.source_url || "").trim();

  s.show_updated = toBool(s.show_updated);
  s.last_verified = String(s.last_verified || "").trim();
  s.status = String(s.status || "").trim().toLowerCase();

  return s;
}

function getSearchBlob(s) {
  const fields = [
    s.id, s.name, s.district, s.district_en, s.area_group,
    s.location_type, s.address_display, s.note, s.source_url,
    ...(s.tags || []), ...(s.aliases || [])
  ];
  return norm(fields.join(" "));
}

function matchesQuery(s, q) {
  if (!q) return true;
  const blob = getSearchBlob(s);
  const variants = expandQueryVariants(q);
  return variants.some(v => blob.includes(v));
}

/* =========================
   ✅ State
========================= */
let state = {
  q: "",
  activeTags: new Set(),
  nearMeMode: false,
  userLoc: null, // {lat,lng}
  requireCoords: false,
};

let pageSize = 60;
let page = 1;

/* =========================
   ✅ Leaflet Maps (desktop + mobile)
========================= */
const defaultCenter = [22.3369, 114.1476]; // around Lai Chi Kok (safe default)
const defaultZoom = 12;

const mapDesktop = L.map("mapDesktop", { zoomControl: false }).setView(defaultCenter, defaultZoom);
const mapMobile  = L.map("mapMobile",  { zoomControl: false }).setView(defaultCenter, defaultZoom);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(mapDesktop);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(mapMobile);

const layerDesktop = L.layerGroup().addTo(mapDesktop);
const layerMobile  = L.layerGroup().addTo(mapMobile);

let userMarkerDesktop = null;
let userMarkerMobile  = null;

function setUserMarker(lat, lng) {
  if (userMarkerDesktop) layerDesktop.removeLayer(userMarkerDesktop);
  if (userMarkerMobile)  layerMobile.removeLayer(userMarkerMobile);

  userMarkerDesktop = L.circleMarker([lat,lng], { radius: 8, weight: 2, fillOpacity: 0.25 }).addTo(layerDesktop);
  userMarkerMobile  = L.circleMarker([lat,lng], { radius: 8, weight: 2, fillOpacity: 0.25 }).addTo(layerMobile);

  const html = "<b>你而家位置</b><br/>（只作附近搜尋用途）";
  userMarkerDesktop.bindPopup(html);
  userMarkerMobile.bindPopup(html);
}

/* =========================
   ✅ Rendering
========================= */
function matchesTags(s, tagsSet) {
  if (tagsSet.size === 0) return true;
  const t = new Set(s.tags || []);
  for (const tag of tagsSet) if (!t.has(tag)) return false;
  return true;
}

function getFiltered() {
  let items = SALONS
    .filter(s => s.status === "active")
    .filter(s => matchesQuery(s, state.q))
    .filter(s => matchesTags(s, state.activeTags));

  if (state.requireCoords) {
    items = items.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));
  }

  if (state.nearMeMode && state.userLoc) {
    items = items
      .map(s => {
        const has = Number.isFinite(s.lat) && Number.isFinite(s.lng);
        return { ...s, _km: has ? haversineKm(state.userLoc.lat, state.userLoc.lng, s.lat, s.lng) : null };
      })
      .sort((a,b) => {
        if (a._km == null && b._km == null) return 0;
        if (a._km == null) return 1;
        if (b._km == null) return -1;
        return a._km - b._km;
      });
  }

  return items;
}

function renderList(items) {
  const favs = getFavSet();
  const list = document.getElementById("list");

  const shown = items.slice(0, page * pageSize);

  list.innerHTML = shown.map(s => {
    const price = formatPriceDisplay(s);
    const distance = (state.nearMeMode && state.userLoc && s._km != null)
      ? `<span class="text-xs font-semibold text-text-subtle">${s._km.toFixed(2)} km</span>`
      : "";

    const tags = (s.tags || []).slice(0, 5).map(t => `
      <span class="px-2 py-1 bg-background-light rounded text-xs font-medium text-text-subtle">${escapeHtml(t)}</span>
    `).join("");

    const src = s.source_url
      ? `<a class="text-xs text-primary-hover hover:underline" href="${s.source_url}" target="_blank" rel="noopener">Source</a>`
      : `<span class="text-xs text-text-subtle">Source: —</span>`;

    // show_updated = yes 才顯示 last_verified
    const updated = (s.show_updated && s.last_verified)
      ? `<span class="text-[11px] text-text-subtle">Updated: ${escapeHtml(s.last_verified)}</span>`
      : "";

    const hasCoords = Number.isFinite(s.lat) && Number.isFinite(s.lng);
    const pinHint = hasCoords ? "（地圖可顯示）" : "（暫無座標，只顯示列表）";

    const favOn = favs.has(s.id);
    const heartClass = favOn ? "text-tertiary" : "text-text-subtle";

    return `
      <article data-id="${escapeHtml(s.id)}"
        class="salonCard group relative bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-all border border-transparent hover:border-primary/20 cursor-pointer">
        <div class="flex flex-col gap-3">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="text-lg font-extrabold text-text-main leading-tight group-hover:text-primary-hover transition-colors">
                ${escapeHtml(s.name)}
              </h3>
              <p class="text-text-subtle text-sm mt-1">
                ${escapeHtml(s.district || "—")}
                ${s.district_en ? ` • <span class="text-text-subtle/80">${escapeHtml(s.district_en)}</span>` : ""}
                ${price ? ` • <span class="font-semibold">${escapeHtml(price)}</span>` : ""}
              </p>
              <p class="text-[11px] text-text-subtle mt-1">${escapeHtml(pinHint)}</p>
            </div>

            <div class="flex flex-col items-end gap-1">
              ${distance}
              <button data-fav="${escapeHtml(s.id)}" class="btnFav p-1.5 bg-white border border-border-subtle rounded-full hover:bg-background-light">
                <span class="material-symbols-outlined ${heartClass}" style="font-size:20px;">favorite</span>
              </button>
            </div>
          </div>

          <div class="flex flex-wrap gap-2">${tags}</div>

          <div class="pt-3 border-t border-background-light">
            <div class="text-sm text-text-main">
              <span class="material-symbols-outlined align-[-5px] text-[18px] text-text-subtle">location_on</span>
              ${escapeHtml(s.address_display || "—")}
            </div>

            ${s.note ? `<div class="text-xs text-text-subtle mt-1">${escapeHtml(s.note)}</div>` : ""}

            <div class="mt-2 flex items-center justify-between gap-3">
              <p class="text-[11px] text-text-subtle flex items-start gap-1.5 leading-snug">
                <span class="material-symbols-outlined text-[14px] shrink-0 translate-y-[1px]">info</span>
                商廈/工作室：僅顯示大概位置；到訪地址以店方確認為準
              </p>
              <div class="flex flex-col items-end gap-1">
                ${src}
                ${updated}
              </div>
            </div>
          </div>
        </div>
      </article>
    `;
  }).join("");

  document.getElementById("countText").textContent = items.length;
  document.getElementById("btnLoadMore").style.display = (shown.length < items.length) ? "inline-flex" : "none";
}

function renderMarkers(items) {
  layerDesktop.clearLayers();
  layerMobile.clearLayers();

  if (state.userLoc) setUserMarker(state.userLoc.lat, state.userLoc.lng);

  const withCoords = items.filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));

  withCoords.forEach(s => {
    const price = formatPriceDisplay(s);
    const tags = (s.tags || []).slice(0, 6).map(t =>
      `<span style="display:inline-block;margin:2px 4px 0 0;padding:2px 6px;border:1px solid #EBDAD4;border-radius:999px;font-size:11px;">${escapeHtml(t)}</span>`
    ).join("");

    const src = s.source_url
      ? `<div style="margin-top:8px;"><a href="${s.source_url}" target="_blank" rel="noopener" style="color:#E57A85;text-decoration:underline;">Source</a></div>`
      : "";

    const updated = (s.show_updated && s.last_verified)
      ? `<div style="margin-top:8px;font-size:11px;color:#99827D;">Updated: ${escapeHtml(s.last_verified)}</div>`
      : "";

    const html = `
      <div style="min-width:240px;">
        <div style="font-weight:800;font-size:15px;color:#543D37;">${escapeHtml(s.name)}</div>
        <div style="margin-top:4px;font-size:12px;color:#99827D;">
          ${escapeHtml(s.district || "—")}
          ${s.district_en ? ` • ${escapeHtml(s.district_en)}` : ""}
          ${price ? ` • <b>${escapeHtml(price)}</b>` : ""}
        </div>
        <div style="margin-top:8px;font-size:13px;color:#543D37;">
          <b>位置（大概）</b>：${escapeHtml(s.address_display || "—")}
        </div>
        <div style="margin-top:8px;">${tags}</div>
        <div style="margin-top:10px;font-size:11px;color:#99827D;">
          商廈/工作室：僅顯示大概位置；到訪地址以店方確認為準
        </div>
        ${src}
        ${updated}
      </div>
    `;

    const m1 = L.marker([s.lat, s.lng]).addTo(layerDesktop).bindPopup(html);
    const m2 = L.marker([s.lat, s.lng]).addTo(layerMobile).bindPopup(html);

    m1._salonId = s.id;
    m2._salonId = s.id;
  });

  // fit bounds
  if (withCoords.length > 0) {
    const bounds = L.latLngBounds(withCoords.map(s => [s.lat, s.lng]));
    mapDesktop.fitBounds(bounds, { padding: [30,30], maxZoom: 16 });
    mapMobile.fitBounds(bounds, { padding: [30,30], maxZoom: 16 });
  }
}

function syncAll() {
  const items = getFiltered();
  renderList(items);
  renderMarkers(items);
}

/* =========================
   ✅ Load from API
========================= */
async function loadFromSheet() {
  document.getElementById("bannerError").classList.add("hidden");
  document.getElementById("bannerWarn").classList.add("hidden");

  const res = await fetch(API_URL, { cache: "no-store" });
  if (!res.ok) throw new Error("Fetch failed: " + res.status);

  const data = await res.json();

  // 支援：API 回傳 {salons:[...], errors:[...], warnings:[...]} 或直接 array
  let rows = data;
  let v = { errors: [], warnings: [] };

  if (data && typeof data === "object" && !Array.isArray(data)) {
    if (Array.isArray(data.salons)) rows = data.salons;
    if (Array.isArray(data.errors) || Array.isArray(data.warnings)) {
      v.errors = Array.isArray(data.errors) ? data.errors : [];
      v.warnings = Array.isArray(data.warnings) ? data.warnings : [];
    }
  }

  if (!Array.isArray(rows)) throw new Error("API did not return an array");

  const normalized = rows.map(normalizeSalon);

  // 若 API 未提供 validation，就前端自己驗一次（幫你揾 duplicate_id / bad_location_type）
  const localV = validateSalons(normalized);
  VALIDATION = {
    errors: (v.errors.length ? v.errors : localV.errors),
    warnings: (v.warnings.length ? v.warnings : localV.warnings),
  };

  SALONS = normalized;

  // 顯示 warnings（errors 只放 console，避免嚇走用戶）
  if (VALIDATION.warnings.length > 0 || VALIDATION.errors.length > 0) {
    console.warn("Errors:", VALIDATION.errors);
    console.warn("Warnings:", VALIDATION.warnings);

    const w = VALIDATION.warnings.slice(0, 8).map(x => `row ${x.row}: ${x.type} (${x.location_type || ""})`).join("； ");
    const e = VALIDATION.errors.slice(0, 3).map(x => `row ${x.row}: ${x.type} (${x.id || ""})`).join("； ");

    document.getElementById("bannerWarn").classList.remove("hidden");
    document.getElementById("warnText").textContent =
      (e ? `Errors: ${e}. ` : "") + (w ? `Warnings: ${w}${VALIDATION.warnings.length>8 ? "…" : ""}` : "");
  }

  // reset paging
  page = 1;
  syncAll();
}

function showFetchError(err) {
  console.error(err);
  document.getElementById("bannerError").classList.remove("hidden");
}

/* =========================
   ✅ Geolocation (Near Me)
========================= */
function requireHttpsForGeo() {
  // iOS/Chrome 都多數要求 https (file:// / http:// 會 fail)
  const ok = location.protocol === "https:" || location.hostname === "localhost";
  if (!ok) {
    alert("Near Me 需要 HTTPS 才可定位。你而家可能用緊 file:// 或 http://。請用 Netlify / https 網址開。");
  }
  return ok;
}

function requestGeolocation() {
  if (!requireHttpsForGeo()) return;

  if (!navigator.geolocation) {
    alert("你的瀏覽器不支援定位功能。");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.nearMeMode = true;

      setUserMarker(state.userLoc.lat, state.userLoc.lng);
      mapDesktop.setView([state.userLoc.lat, state.userLoc.lng], 15);
      mapMobile.setView([state.userLoc.lat, state.userLoc.lng], 15);

      syncAll();
    },
    (err) => {
      console.warn(err);
      alert("未能取得你的位置（可能未授權定位 / 網絡 / 非 HTTPS）。");
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 20000 }
  );
}

/* =========================
   ✅ Events
========================= */
function setQuery(q) {
  state.q = q || "";
  page = 1;
  syncAll();
}

document.getElementById("qTop").addEventListener("input", e => setQuery(e.target.value));
document.getElementById("qMobile").addEventListener("input", e => setQuery(e.target.value));

document.querySelectorAll(".tagChip").forEach(btn => {
  btn.addEventListener("click", () => {
    const tag = btn.getAttribute("data-tag");
    const active = state.activeTags.has(tag);
    if (active) state.activeTags.delete(tag);
    else state.activeTags.add(tag);

    // toggle UI
    btn.classList.toggle("border-primary", !active);
    btn.classList.toggle("text-primary", !active);
    btn.classList.toggle("bg-primary/10", !active);

    page = 1;
    syncAll();
  });
});

document.getElementById("btnNearMe").addEventListener("click", () => requestGeolocation());
document.getElementById("btnLocateDesktop").addEventListener("click", () => requestGeolocation());
document.getElementById("btnLocateMobile").addEventListener("click", () => requestGeolocation());

document.getElementById("btnZoomInDesktop").addEventListener("click", () => mapDesktop.zoomIn());
document.getElementById("btnZoomOutDesktop").addEventListener("click", () => mapDesktop.zoomOut());
document.getElementById("btnZoomInMobile").addEventListener("click", () => mapMobile.zoomIn());
document.getElementById("btnZoomOutMobile").addEventListener("click", () => mapMobile.zoomOut());

document.getElementById("btnHasCoords").addEventListener("click", (e) => {
  state.requireCoords = !state.requireCoords;
  e.currentTarget.classList.toggle("border-primary", state.requireCoords);
  e.currentTarget.classList.toggle("text-primary", state.requireCoords);
  e.currentTarget.classList.toggle("bg-primary/10", state.requireCoords);
  page = 1;
  syncAll();
});

document.getElementById("btnReset").addEventListener("click", () => {
  state.q = "";
  state.activeTags.clear();
  state.nearMeMode = false;
  state.userLoc = null;
  state.requireCoords = false;
  page = 1;

  document.getElementById("qTop").value = "";
  document.getElementById("qMobile").value = "";

  document.querySelectorAll(".tagChip").forEach(btn => {
    btn.classList.remove("border-primary", "text-primary", "bg-primary/10");
  });

  document.getElementById("btnHasCoords").classList.remove("border-primary","text-primary","bg-primary/10");

  syncAll();
});

document.getElementById("btnLoadMore").addEventListener("click", () => {
  page += 1;
  syncAll();
});

// Fav toggle
document.getElementById("list").addEventListener("click", (e) => {
  const favBtn = e.target.closest(".btnFav");
  if (favBtn) {
    e.stopPropagation();
    const id = favBtn.getAttribute("data-fav");
    const favs = getFavSet();
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavSet(favs);
    syncAll();
    return;
  }

  const card = e.target.closest(".salonCard");
  if (!card) return;
  const id = card.getAttribute("data-id");
  const items = getFiltered();
  const s = items.find(x => x.id === id);
  if (!s) return;

  // 若無座標，就唔跳 map，只係提示
  if (!Number.isFinite(s.lat) || !Number.isFinite(s.lng)) {
    alert("此店暫未有座標，只能顯示列表。你可稍後補 lat/lng。");
    return;
  }

  // focus both maps
  mapDesktop.setView([s.lat, s.lng], 16);
  mapMobile.setView([s.lat, s.lng], 16);

  layerDesktop.eachLayer(layer => { if (layer._salonId === id) layer.openPopup(); });
  layerMobile.eachLayer(layer => { if (layer._salonId === id) layer.openPopup(); });
});

/* =========================
   ✅ Mobile Map/List toggle fix
   (Leaflet needs invalidateSize after container becomes visible)
========================= */
const panelList = document.getElementById("panelList");
const panelMapMobile = document.getElementById("panelMapMobile");
const tabList = document.getElementById("tabList");
const tabMap = document.getElementById("tabMap");

function showList() {
  panelList.classList.remove("hidden");
  panelMapMobile.classList.add("hidden");
  tabList.classList.add("bg-text-main","text-white");
  tabList.classList.remove("text-text-main");
  tabMap.classList.remove("bg-text-main","text-white");
  tabMap.classList.add("text-text-main");
}

function showMap() {
  panelList.classList.add("hidden");
  panelMapMobile.classList.remove("hidden");
  tabMap.classList.add("bg-text-main","text-white");
  tabMap.classList.remove("text-text-main");
  tabList.classList.remove("bg-text-main","text-white");
  tabList.classList.add("text-text-main");

  // ✅ critical fix
  setTimeout(() => {
    mapMobile.invalidateSize(true);
    // 若有 marker，fit 一下
    const items = getFiltered().filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lng));
    if (items.length) {
      const bounds = L.latLngBounds(items.map(s => [s.lat, s.lng]));
      mapMobile.fitBounds(bounds, { padding: [30,30], maxZoom: 16 });
    }
  }, 150);
}

tabList.addEventListener("click", showList);
tabMap.addEventListener("click", showMap);

/* =========================
   ✅ Boot
========================= */
loadFromSheet().catch(showFetchError);

// 每 5 分鐘自動刷新一次（可改／可刪）
setInterval(() => loadFromSheet().catch(console.error), 5 * 60 * 1000);
</script>
